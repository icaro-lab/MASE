name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install controller dependencies
        run: python -m pip install -r services/controller/requirements.txt pytest pytest-asyncio
      - name: Run controller tests
        working-directory: services/controller
        run: PYTHONPATH=. python -m pytest tests/test_catalog.py tests/test_config_default_environment_resolution.py tests/test_public_runs_routes.py tests/test_run_launcher_frontend_ports.py tests/test_runs_domain_reset.py tests/test_public_observability_routes.py -q

  admin-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install admin backend dependencies
        run: python -m pip install -r services/admin/backend/requirements.txt pytest pytest-asyncio
      - name: Run admin backend tests
        run: PYTHONPATH=. python -m pytest services/admin/backend/tests/test_run_control_proxy_passthrough.py -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/admin/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix services/admin/frontend ci
      - name: Run frontend tests
        run: npm --prefix services/admin/frontend test -- --run
      - name: Build frontend
        run: npm --prefix services/admin/frontend run build

  stack-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Create local env
        run: |
          cat > .env <<'EOF'
          OPENROUTER_API_KEY=dummy
          EOF
      - name: Boot stack
        run: bash scripts/up_stack.sh
      - name: Run hello-world smoke
        run: bash scripts/verify_hello_world_smoke.sh
      - name: Tear down stack
        if: always()
        run: bash scripts/down_stack.sh
