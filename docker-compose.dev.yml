# =============================================================================
# MASE Development Override - Shared Volumes for Testing
# =============================================================================
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# This override mounts host directories for easy debugging:
# - ./data/runs         -> Run state, metrics, and SQLite DB
# - ./data/agents       -> Agent filesystems
# - ./data/environments -> Environment-local data
# - ./data/orchestrator -> Orchestrator state
# - ./data/logs         -> Service logs
# =============================================================================

services:
  orchestrator:
    volumes:
      - ./services/orchestrator/app:/app/app
      - ./services/orchestrator/requirements.txt:/app/requirements.txt:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./environments:/app/environments:ro
      - ./services/agent-launcher:/app/services/agent-launcher:ro
      - ./compose:/app/compose:ro
      - ./data/orchestrator:/app/data  # Shared host directory

  controller:
    volumes:
      - ./services/controller:/app
      - ./data/runs:/data               # Shared host directory
      - ./data/logs:/app/logs           # Shared logs

  agent-launcher:
    volumes:
      - ./services/agent-launcher:/app
      - ./runtimes:/app/runtimes:ro
      - ./environments:/app/environments:ro
      - ./data/agents:/agents           # Shared agent filesystem

  admin-backend:
    volumes:
      - ./services/admin/backend:/app
      - ./data/admin:/app/data          # Shared admin data

  # Override volumes section - remove named volumes in favor of bind mounts
  # Note: postgres and redis keep named volumes for performance

# Remove named volumes that we're replacing with bind mounts
# The base docker-compose.yml defines these, but we're overriding per-service
